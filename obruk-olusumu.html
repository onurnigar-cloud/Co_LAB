<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Obruk Oluşumu</title><style>:root{--o:#f47b20;--ink:#152238;--mut:#667085}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Arial,sans-serif;background:#eaf1f4;color:var(--ink)}body{display:grid;place-items:center}.app{width:min(100vw,177.78vh);aspect-ratio:16/9;background:linear-gradient(#fbfdff,#e5eef2);position:relative;overflow:hidden;box-shadow:0 25px 70px #20344a33}.head{height:84px;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#fff,#ffffffb8,transparent);position:absolute;inset:0 0 auto;z-index:5}.brand{display:flex;gap:13px;align-items:center}.logo{width:46px;height:46px;border-radius:14px;background:var(--o);color:#fff;display:grid;place-items:center;font-size:22px}.small{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--mut);font-weight:800}.head h1{margin:4px 0 0;font-size:clamp(22px,2vw,34px)}.pill{background:#15223812;padding:10px 14px;border-radius:999px;font-weight:800}.stage{position:absolute;inset:70px 0 120px}.stage svg{width:100%;height:100%}.card{position:absolute;left:28px;bottom:132px;width:min(430px,38vw);padding:18px 20px;border-radius:22px;background:#fffffff0;box-shadow:0 16px 45px #23384b29;z-index:4}.card h2{margin:0 0 8px;font-size:clamp(18px,1.5vw,26px)}.card p{margin:0;color:#435466;line-height:1.5;font-size:clamp(13px,1.03vw,17px)}.controls{position:absolute;inset:auto 0 0;height:120px;padding:18px 28px;background:#fffffff2;border-top:1px solid #15223812;z-index:6}.row{display:flex;gap:14px;align-items:center}.play{width:48px;height:48px;border:0;border-radius:50%;background:var(--ink);color:white;font-size:20px;cursor:pointer}.reset{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.timeline{flex:1;position:relative;height:50px;display:flex;align-items:center}.track{position:absolute;left:0;right:0;height:6px;background:#d6e0e6;border-radius:99px}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--o),#ffb55f);border-radius:99px;transition:.25s}.steps{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center}.step{width:30px;height:30px;border-radius:50%;border:3px solid #c8d4dc;background:#fff;font-weight:900;cursor:pointer}.step.on{background:var(--o);border-color:var(--o);color:#fff;transform:scale(1.1);box-shadow:0 0 0 7px #f47b2022}.legend{display:flex;justify-content:space-between;margin-top:4px;color:#6b7b89;font-size:12px;font-weight:700}.rain{stroke:#2388e8;stroke-width:3;stroke-linecap:round;stroke-dasharray:9 14;animation:rain .55s linear infinite}.dust{fill:#8d8173;opacity:0}.shake{animation:shake .35s linear 3}.collapse .dust{animation:dust 1s ease-out}.collapse #roof{animation:fall .9s ease-in forwards}.collapse #surface{animation:dip .9s ease-in forwards}@keyframes rain{to{stroke-dashoffset:-23}}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@keyframes fall{to{transform:translateY(92px) scaleY(.45);opacity:.7}}@keyframes dip{to{transform:translateY(34px)}}@keyframes dust{50%{opacity:.55}100%{opacity:0;transform:translateY(-30px) scale(1.5)}}@media(max-width:760px){.head{height:68px;padding:12px 16px}.stage{inset:60px 0 104px}.card{left:16px;bottom:112px;width:58vw;padding:13px 15px}.controls{height:104px;padding:12px 16px}.legend{display:none}}</style></head><body><main class="app"><header class="head"><div class="brand"><div class="logo">◉</div><div><div class="small">Karstik şekiller</div><h1>Obruk Nasıl Oluşur?</h1></div></div><div class="pill" id="pill">Aşama 1 / 8</div></header><section class="stage"><svg viewBox="0 0 1600 780" aria-label="Obruk oluşumu kesiti"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8fc52f"/><stop offset="1" stop-color="#5d8d21"/></linearGradient><linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b9bec2"/><stop offset="1" stop-color="#747b81"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".2"/></filter></defs><g id="world" filter="url(#s)"><rect x="485" y="240" width="630" height="345" rx="5" fill="url(#r)"/><rect id="surface" x="485" y="213" width="630" height="48" rx="18" fill="url(#g)"/><path d="M485 330h630M485 420h630M485 510h630M610 240v345M770 240v345M940 240v345" stroke="#555d62" stroke-width="3" opacity=".55"/><path id="cracks" d="M800 220l-18 62 25 38-33 52 20 51-29 55 21 60" fill="none" stroke="#41484d" stroke-width="8" stroke-linecap="round"/><path id="cracks2" d="M795 320l-55 30M790 390l68 35M780 465l-78 38M790 520l78 27" fill="none" stroke="#41484d" stroke-width="5" stroke-linecap="round"/><ellipse id="cavity" cx="795" cy="490" rx="0" ry="0" fill="#252b2f"/><path id="water" d="M800 219C800 310 780 350 795 430C805 495 790 525 800 570" fill="none" stroke="#2f95e9" stroke-width="9" stroke-linecap="round" opacity="0"/><g id="roof"><path d="M685 470Q795 410 905 470L870 535Q795 500 720 535Z" fill="#666e73" opacity="0"/></g><g id="rubble" opacity="0" fill="#c5c8ca" stroke="#6a7075" stroke-width="2"><circle cx="750" cy="548" r="29"/><circle cx="803" cy="555" r="36"/><circle cx="855" cy="550" r="27"/></g><g id="rain" opacity="0"><path class="rain" d="M665 105v112M715 90v122M765 110v102M815 80v135M865 105v110M915 90v125"/><path d="M650 90q25-52 74-24q22-58 77-13q38-33 78 13q55-7 62 43H650q-25-9 0-19" fill="#61696e"/></g><g id="dust" class="dust"><circle cx="705" cy="520" r="18"/><circle cx="750" cy="505" r="24"/><circle cx="845" cy="510" r="22"/><circle cx="895" cy="525" r="17"/></g></g></svg></section><aside class="card"><h2 id="ttl"></h2><p id="txt"></p></aside><footer class="controls"><div class="row"><button class="play" id="play">❚❚</button><button class="reset" id="reset">Başa dön</button><div class="timeline"><div class="track"><div class="fill" id="fill"></div></div><div class="steps" id="steps"></div></div></div><div class="legend"><span>Sızma</span><span>Çözünme</span><span>Boşluk büyümesi</span><span>Çökme</span><span>Obruk</span></div></footer></main><script>const T=['Başlangıç: Çatlaklı kireç taşı','Su çatlaklara sızıyor','Kimyasal çözünme başlıyor','Yer altında boşluk büyüyor','Yağış çözünmeyi hızlandırıyor','Tavan zayıflıyor','Ani çökme gerçekleşiyor','Obruk oluşumu tamamlanıyor'];const P=['Kireç taşındaki doğal çatlaklar yüzey sularına geçiş yolu oluşturur.','Karbon dioksitçe zengin su çatlaklardan yer altına sızar.','Zayıf asidik su kireç taşını çözerek çatlakları genişletir.','Çözünme sürdükçe yer altında giderek daha büyük bir boşluk gelişir.','Yoğun yağış sızmayı, çözünmeyi ve malzeme taşınmasını hızlandırır.','Boşluğun tavanı incelir ve taşıma gücünü kaybetmeye başlar.','Tavanın dayanım sınırı aşılınca yüzey malzemesi boşluğa çöker.','Dik yamaçlı ve derin bir çöküntü olan obruk ortaya çıkar.'];let s=0,run=true,t0=performance.now(),dur=2300;const q=x=>document.querySelector(x),qa=x=>[...document.querySelectorAll(x)],cav=q('#cavity'),rain=q('#rain'),water=q('#water'),roof=q('#roof'),rub=q('#rubble'),world=q('#world');for(let i=0;i<8;i++){let b=document.createElement('button');b.className='step';b.textContent=i+1;b.onclick=()=>go(i);q('#steps').appendChild(b)}function go(i){s=i;t0=performance.now();draw()}function draw(){q('#pill').textContent=`Aşama ${s+1} / 8`;q('#ttl').textContent=T[s];q('#txt').textContent=P[s];q('#fill').style.width=s/7*100+'%';qa('.step').forEach((e,i)=>e.classList.toggle('on',i===s));let rx=[0,0,18,48,80,110,130,165][s],ry=[0,0,12,32,56,76,88,130][s];cav.setAttribute('rx',rx);cav.setAttribute('ry',ry);water.style.opacity=s>=1?1:0;rain.style.opacity=s>=4&&s<=5?1:0;roof.style.opacity=s>=5?1:0;rub.style.opacity=s>=6?1:0;world.classList.remove('collapse','shake');if(s===6){void world.offsetWidth;world.classList.add('collapse','shake')}if(s===7){q('#surface').setAttribute('d','')}}function loop(n){if(run&&n-t0>dur){if(s<7)go(s+1);else{run=false;q('#play').textContent='▶'}}requestAnimationFrame(loop)}q('#play').onclick=()=>{run=!run;q('#play').textContent=run?'❚❚':'▶';t0=performance.now()};q('#reset').onclick=()=>{run=true;q('#play').textContent='❚❚';go(0)};draw();requestAnimationFrame(loop)</script></body></html>
